version: 2

project_name: aegis

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: aegis
    main: ./cmd/aegis
    binary: aegis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - id: aegis
    builds:
      - aegis
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: aegis
    repository:
      owner: rishavkumarj
      name: homebrew-tap
    homepage: "https://github.com/rishavkumarj/aegis"
    description: "API Key & Security Governance Proxy"
    license: "MIT"
    install: |
      bin.install "aegis"
    test: |
      system "#{bin}/aegis", "version"

nfpms:
  - id: aegis
    package_name: aegis
    vendor: rishavkumarj
    homepage: "https://github.com/rishavkumarj/aegis"
    description: "API Key & Security Governance Proxy"
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: config.example.yaml
        dst: /etc/aegis/config.yaml
        type: config
